openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: ai
    description: AI Friend chat and creative generation
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ai/generate:
    post:
      operationId: generateAiAsset
      tags: [ai]
      summary: Generate a creative asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateAiAssetRequest"
      responses:
        "200":
          description: Generated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedAiAsset"
        "400":
          description: Invalid request
        "503":
          description: AI provider unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GenerateAiAssetRequest:
      type: object
      properties:
        type:
          type: string
          enum: [image, story, video]
        prompt:
          type: string
          minLength: 1
          maxLength: 2000
        action:
          type: string
          maxLength: 120
      required:
        - type
        - prompt
    GeneratedAiAsset:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [image, story, video]
        title:
          type: string
        prompt:
          type: string
        uri:
          type: string
        text:
          type: string
        mimeType:
          type: string
        status:
          type: string
          enum: [complete, queued]
        provider:
          type: string
      required:
        - id
        - type
        - title
        - prompt
        - status
        - provider

